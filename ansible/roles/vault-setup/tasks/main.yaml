- name: Add Vault Helm repo
  kubernetes.core.helm_repository:
    name: hashicorp
    repo_url: "https://helm.releases.hashicorp.com"
    state: present

- name: Install Vault
  kubernetes.core.helm:
    name: vault
    chart_ref: hashicorp/vault
    release_namespace: vault
    create_namespace: true
    values:
      server:
        dev:
          enabled: true
          devRootToken: "root"
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits: { cpu: 250m, memory: 512Mi }

- name: Install External Secrets Operator
  kubernetes.core.helm:
    name: external-secrets
    chart_ref: external-secrets
    chart_repo_url: https://charts.external-secrets.io
    release_namespace: external-secrets
    create_namespace: true
    values:
      installCRDs: true

- name: Wait for Vault to be ready
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: vault
    label_selectors:
      - app.kubernetes.io/name=vault
  register: vault_pods
  until: vault_pods.resources | length > 0 and vault_pods.resources[0].status.phase == 'Running'
  retries: 30
  delay: 10

- name: Configure Vault for External Secrets
  kubernetes.core.k8s_exec:
    namespace: vault
    pod: vault-0
    command: >-
      sh -c "export VAULT_TOKEN=root;
      vault auth list | grep -q kubernetes/ || vault auth enable kubernetes;
      vault write auth/kubernetes/config kubernetes_host=https://kubernetes.default.svc;
      echo 'path \"secret/data/prod/*\" { capabilities = [\"read\"] }' | vault policy write eso-read -;
      vault write auth/kubernetes/role/eso bound_service_account_names=external-secrets bound_service_account_namespaces=external-secrets policies=eso-read ttl=1h"
  no_log: true