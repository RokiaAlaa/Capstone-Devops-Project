name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user_service, product_service, order_service]
        include:
          - service: user_service
            db_name: user_service_db
          - service: product_service
            db_name: product_service_db
          - service: order_service
            db_name: order_service_db

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ${{ matrix.db_name }}
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
        
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
      
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-django


    - name: Run migrations
      env:
        DEBUG: "True"
        DB_NAME: ${{ matrix.db_name }}
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_HOST: localhost
        DB_PORT: 5432
        REDIS_URL: redis://localhost:6379/0
      run: python manage.py migrate

    - name: Run tests
      env:
        DEBUG: "True"
        DB_NAME: ${{ matrix.db_name }}
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_HOST: localhost
        DB_PORT: 5432
        REDIS_URL: redis://localhost:6379/0
      run: pytest

  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
          service: [user_service, product_service, order_service]
          include:
            - service: user_service
              image_name: user-service
            - service: product_service
              image_name: product-service
            - service: order_service
              image_name: order-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Get Git commit SHA
        id: git
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: backend/${{ matrix.service }}
          push: True
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image_name }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image_name }}:${{ steps.git.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha, mode=max
          
      - name: Notify Slack
        if: always()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"CI Pipeline for ${{ matrix.service }}: ${{ job.status }}"}' \
          ${{ secrets.SLACK_WEBHOOK }}

  validate:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4

    - name: Validate Kubernetes manifests (YAML syntax)
      run: |
        pip install pyyaml
        for file in k8s/*.yaml; do
          echo "Checking $file"
          python -c "import yaml; list(yaml.safe.load_all(open('$file')))"
        done

    - name: Validate Terraform formatting
      uses: hashicorp/setup-terraform@v3

    - name: Terraform fmt check (prod)
      working-directory: infrastructure/environments/prod
      run: terraform fmt -check -recursive
      continue-on-error: true