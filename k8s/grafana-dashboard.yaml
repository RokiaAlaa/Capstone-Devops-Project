apiVersion: v1
kind: ConfigMap
metadata:
  name: capstone-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  capstone.json: |
    {
      "uid": "capstone-services",
      "title": "Capstone Services",
      "schemaVersion": 39,
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {"id": 1, "type": "timeseries", "title": "Request Rate",
         "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
         "targets": [{"expr": "sum by (destination_service_name) (rate(istio_requests_total{destination_service_namespace=\"prod\"}[5m]))"}]},
        {"id": 2, "type": "timeseries", "title": "Error Rate (5xx)",
         "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
         "targets": [{"expr": "sum by (destination_service_name) (rate(istio_requests_total{destination_service_namespace=\"prod\",response_code=~\"5..\"}[5m]))"}]},
        {"id": 3, "type": "timeseries", "title": "Response Time p95 (ms)",
         "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
         "targets": [{"expr": "histogram_quantile(0.95, sum by (le, destination_service_name) (rate(istio_request_duration_milliseconds_bucket{destination_service_namespace=\"prod\"}[5m])))"}]},
        {"id": 4, "type": "timeseries", "title": "Pod Memory Usage",
         "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
         "targets": [{"expr": "container_memory_working_set_bytes{namespace=\"prod\",container=~\".*-service\"}"}]}
      ]
    }