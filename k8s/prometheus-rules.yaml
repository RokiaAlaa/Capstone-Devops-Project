apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: capstone-rules
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: capstone.rules
      interval: 30s
      rules:
      - alert: HighErrorRate
        expr: |
          sum by (destination_service_name) (rate(istio_requests_total{destination_service_namespace="prod",response_code=~"5.."}[5m]))
          / sum by (destination_service_name) (rate(istio_requests_total{destination_service_namespace="prod"}[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx rate on {{ $labels.destination_service_name }}"
          description: "Error ratio is {{ $value | humanizePercentage }}"

      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, sum by (le, destination_service_name)
          (rate(istio_request_duration_milliseconds_bucket{destination_service_namespace="prod"}[5m]))) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency above 1s on {{ $labels.destination_service_name }}"

      - alert: PodCrashLooping
        expr: increase(kube_pod_container_status_restarts_total{namespace="prod"}[15m]) > 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.pod }} is crash looping"