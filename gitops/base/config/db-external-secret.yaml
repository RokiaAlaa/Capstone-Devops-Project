apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: db-credentials
  data:
    - secretKey: db-user
      remoteRef:
        key: prod/db
        property: user
    - secretKey: db-password
      remoteRef:
        key: prod/db
        property: password