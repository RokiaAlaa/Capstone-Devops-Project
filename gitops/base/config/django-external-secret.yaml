apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: django-secret
  namespace: prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: django-secret
  data:
    - secretKey: secret-key
      remoteRef:
        key: prod/django
        property: secret-key