apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: config-prod
  namespace: argocd
spec:
  project: default
  source: 
    repoURL: https://github.com/RokiaAlaa/Capstone-Devops-Project.git
    targetRevision: HEAD
    path: gitops/overlays/prod/config
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        istio-injection: enabled